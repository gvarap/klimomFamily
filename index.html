<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Klimom Milk Calculator</title>

        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
        />

        <style>
            body {
                font-family: Inter, sans-serif;
                background: #f6f7f9;
                padding: 20px;
            }

            .container {
                max-width: 420px;
                margin: auto;
            }

            .card {
                background: white;
                padding: 24px;
                border-radius: 14px;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            }

            h2 {
                margin-bottom: 16px;
            }

            label {
                font-size: 13px;
                font-weight: 600;
                display: block;
                margin-top: 10px;
            }

            small {
                font-size: 12px;
                color: #777;
            }

            input {
                width: 100%;
                padding: 12px;
                margin: 6px 0 16px;
                border-radius: 10px;
                border: 1px solid #ddd;
            }

            button {
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 10px;
                font-weight: 600;
                cursor: pointer;
            }

            .primary {
                background: #2d8659;
                color: white;
            }

            .whatsapp {
                background: #25d366;
                color: white;
                margin-top: 12px;
            }

            .hidden {
                display: none;
            }

            .result {
                margin-top: 20px;
                padding: 16px;
                background: #e8f5ee;
                border-radius: 10px;
                text-align: center;
                line-height: 1.6;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <!-- STEP 1 -->
            <div id="step1" class="card">
                <h2>🥛 Klimom Milk Calculator</h2>

                <label>Name</label>
                <input type="text" id="name" placeholder="Enter your name" />

                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" />

                <label>Phone</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                />

                <button class="primary" onclick="goToStep2()">
                    Continue →
                </button>
            </div>

            <!-- STEP 2 -->
            <div id="step2" class="card hidden">
                <h2>👨‍👩‍👧‍👦 Family Details</h2>

                <label>Adults 👨</label>
                <input type="number" id="adults" value="2" />

                <label>Kids 👶</label>
                <input type="number" id="kids" value="2" />

                <label>Milk per person (Liters/day) 🥛</label>
                <input type="number" id="consumption" value="0.25" step="0.1" />
                <small>Example: 0.25L = 250ml</small>

                <!-- Fixed Price -->
                <input type="hidden" id="price" value="250" />
                <p>💰 Price: ₹250 per liter</p>

                <button class="primary" onclick="calculate()">Calculate</button>

                <div id="resultBox" class="result hidden"></div>

                <a id="whatsappBtn" class="hidden" target="_blank">
                    <button class="whatsapp">📲 Order Klimom Milk</button>
                </a>
            </div>
        </div>

        <script>
            // YOUR GOOGLE SCRIPT URL
            var GOOGLE_SCRIPT_URL =
                "https://script.google.com/macros/s/AKfycbwa825R9ISw-DS0SDCTNjz8A3iedGV8xk7v8aHbYU2FUowC6KnAivI_FFEnXLpZj41NEQ/exec";

            var user = {};

            function goToStep2() {
                user.name = document.getElementById("name").value;
                user.email = document.getElementById("email").value;
                user.phone = document.getElementById("phone").value;

                if (!user.name || !user.phone) {
                    alert("Please fill Name & Phone");
                    return;
                }

                document.getElementById("step1").classList.add("hidden");
                document.getElementById("step2").classList.remove("hidden");
            }

            function calculate() {
                var adults = +document.getElementById("adults").value || 0;
                var kids = +document.getElementById("kids").value || 0;
                var consumption =
                    +document.getElementById("consumption").value || 0;
                var price = +document.getElementById("price").value || 0;

                var total = adults + kids;
                var daily = total * consumption;
                var monthly = daily * 30;
                var cost = monthly * price;

                // SHOW RESULT
                document.getElementById("resultBox").innerHTML =
                    "🥛 Daily: <b>" +
                    daily.toFixed(1) +
                    "L</b><br>" +
                    "📅 Monthly: <b>" +
                    monthly.toFixed(0) +
                    "L</b><br>" +
                    "💰 Cost: <b>₹" +
                    cost.toFixed(0) +
                    "</b><br><br>" +
                    "🚚 Fresh milk delivered daily";

                document.getElementById("resultBox").classList.remove("hidden");

                // SEND TO GOOGLE SHEETS
                fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: user.name,
                        email: user.email,
                        phone: user.phone,
                        adults: adults,
                        kids: kids,
                        perPerson: consumption,
                        daily: daily,
                        monthly: monthly,
                        cost: cost,
                        source: "milk_calculator",
                    }),
                });

                // WHATSAPP LINK
                var WHATSAPP_BASE_URL =
                    "https://api.whatsapp.com/send/?phone=919100741305";

                var message = encodeURIComponent(
                    "Hi, I want Klimom milk subscription.\n\n" +
                        "Name: " +
                        user.name +
                        "\n" +
                        "Phone: " +
                        user.phone +
                        "\n\n" +
                        "Daily Requirement: " +
                        daily.toFixed(1) +
                        "L\n" +
                        "Monthly Cost: ₹" +
                        cost.toFixed(0),
                );

                var fullURL = WHATSAPP_BASE_URL + "&text=" + message;

                var btn = document.getElementById("whatsappBtn");
                btn.href = fullURL;
                btn.classList.remove("hidden");
            }
        </script>
    </body>
</html>
